name: Publish initial LSPosed release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-initial-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from upstream release
        run: |
          curl --fail --location --retry 3 \
            -o SougouEmojiFixer-1.0.0.apk \
            https://github.com/250king/SougouEmojiFixer/releases/download/1.0.0/app-release.apk

      - name: Verify APK checksum
        run: |
          echo "46998d57e1da7e2f3ca39afa61880e292d27d2ec34e62b26b5f48ddf570dd580  SougouEmojiFixer-1.0.0.apk" | sha256sum --check --strict

      - name: Create or update LSPosed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="10000-1.0.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" SougouEmojiFixer-1.0.0.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" SougouEmojiFixer-1.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "1.0.0" \
              --notes $'首个公开版本。\n\n源码：https://github.com/250king/SougouEmojiFixer\n\n为搜狗输入法小米版补全并统一 Unicode Emoji，提供 Noto Emoji 与表情分组排序支持。'
          fi
